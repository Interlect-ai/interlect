name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:audit
      - run: npx tsc --noEmit
      - run: npm run typecheck:scripts
      - run: npx eslint src
      - run: npm run i18n:check
      - run: npm test
      - run: npm run check:migrations

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:local -- fresh
      - run: npm run test:rls
      - if: always()
        run: npm run db:local -- down
