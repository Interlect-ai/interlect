name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your team where Interlect falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
