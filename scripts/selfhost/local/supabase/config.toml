# A local Supabase (Supabase CLI, Docker) for the self-host end-to-end test
# (.github/workflows/selfhost-e2e.yml, scripts/selfhost/e2e.ts). Not a real project: it listens
# on 127.0.0.1 only and is thrown away after the run. The schema comes from db/migrations through
# scripts/run-migrations.mjs (as npm run setup does), never from the CLI's own migrations folder.
# The auth settings mirror what npm run setup sets on a real project (authConfigFor in
# scripts/customers/lib/provision.ts): invite only, password sign-in, 12 characters, TOTP on.
#
#   supabase start --workdir scripts/selfhost/local
#   supabase stop --workdir scripts/selfhost/local --no-backup

project_id = "interlect-selfhost-e2e"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
